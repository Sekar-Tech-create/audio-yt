<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
    #player-wrap { position: fixed; inset: 0; width: 100%; height: 100%; opacity: 0.01; }
    #click-shield { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 10; cursor: pointer; background: transparent; }
  </style>
</head>
<body>
  <div id="player-wrap"><div id="p"></div></div>
  <div id="click-shield" onclick="toggleDirect()"></div>

  <script src="https://youtube.com"></script>
  <script>
    let player, ready = false, playing = false;
    const v = new URLSearchParams(location.search).get('v') || '0IJVTLaX0J8';

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('p', {
        height: '100%',
        width: '100%',
        videoId: v,
        playerVars: { autoplay: 0, controls: 0, playsinline: 1, rel: 0 },
        events: {
          onReady: (e) => {
            ready = true;
            e.target.unMute();
            e.target.setVolume(100);
          },
          onStateChange: (e) => {
            if (e.data === YT.PlayerState.ENDED) {
              playing = false;
              parent.postMessage({ ytState: 'paused' }, '*');
            }
          }
        }
      });
    }

    // Klik langsung terjadi di dalam domain https://github.io -> 100% diizinkan bersuara!
    function toggleDirect() {
      if (!ready || !player) return;
      if (!playing) {
        player.unMute();
        player.setVolume(100);
        player.playVideo();
        playing = true;
        parent.postMessage({ ytState: 'playing' }, '*');
      } else {
        player.pauseVideo();
        playing = false;
        parent.postMessage({ ytState: 'paused' }, '*');
      }
    }

    window.addEventListener('message', (e) => {
      if (!ready || !player || !e.data) return;
      if (e.data.cmd === 'pause') {
        player.pauseVideo();
        playing = false;
        parent.postMessage({ ytState: 'paused' }, '*');
      }
      if (e.data.cmd === 'seek') {
        player.seekTo(Math.max(0, (player.getCurrentTime() || 0) + e.data.sec), true);
      }
    });
  </script>
</body>
</html>
