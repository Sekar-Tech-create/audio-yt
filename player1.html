<!DOCTYPE html>
<html>
<body style="margin:0;background:#000;overflow:hidden">
<iframe id="yt" width="250" height="250" style="border:0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
<script>
  const v = new URLSearchParams(location.search).get('v') || '6GJYrT-EwDg';
  const f = document.getElementById('yt');

  window.addEventListener('message', (e) => {
    if (!e.data) return;
    if (e.data.cmd === 'play') {
      const s = Math.max(0, Math.floor(e.data.sec || 0));
      f.src = `https://youtube.com{v}?autoplay=1&start=${s}&playsinline=1&rel=0`;
    }
    if (e.data.cmd === 'pause') {
      f.src = '';
    }
  });
</script>
</body>
</html>
