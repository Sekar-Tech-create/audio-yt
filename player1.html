<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>* { margin: 0; padding: 0; } body { background: #000; overflow: hidden; }</style>
</head>
<body>
  <div id="p"></div>
  <script src="https://youtube.com"></script>
  <script>
    let player = null, ready = false;
    const v = new URLSearchParams(location.search).get('v') || '0IJVTLaX0J8';

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('p', {
        height: '200',
        width: '200',
        videoId: v,
        playerVars: { autoplay: 0, controls: 0, playsinline: 1, rel: 0 },
        events: {
          onReady: (e) => {
            ready = true;
            e.target.unMute();
            e.target.setVolume(100);
          }
        }
      });
    }

    window.addEventListener('message', (e) => {
      if (!ready || !player || !e.data) return;
      if (e.data.cmd === 'play') {
        player.unMute();
        player.setVolume(100);
        player.playVideo();
      }
      if (e.data.cmd === 'pause') {
        player.pauseVideo();
      }
      if (e.data.cmd === 'seek') {
        player.seekTo(Math.max(0, (player.getCurrentTime() || 0) + e.data.sec), true);
      }
    });
  </script>
</body>
</html>
